# Prometheus 监控配置

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'vector-warehouse'
    environment: 'dev'

scrape_configs:
  # ClickHouse 指标
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:9363']
    metrics_path: /metrics

  # API 服务指标
  - job_name: 'api-service'
    static_configs:
      - targets: ['api-service:8000']
    metrics_path: /metrics

  # Redis 指标（需要 redis_exporter）
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']